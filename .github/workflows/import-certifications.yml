name: Import certifications (sur commit d'un export CSV)

# Se déclenche quand un fichier CSV est ajouté/modifié dans data/certifications/.
# Le fichier doit être téléchargé À LA MAIN depuis snepmusique.com ou upfi.fr — voir
# pipelines/import-certifications.js pour le pourquoi (robots.txt de SNEP interdit
# l'accès automatisé). Ce workflow automatise seulement l'IMPORT, pas le téléchargement.
#
# Nommage attendu : data/certifications/snep-*.csv ou data/certifications/upfi-*.csv
# (la source est déduite du préfixe du nom de fichier).

on:
  push:
    paths:
      - "data/certifications/*.csv"
  workflow_dispatch: {}

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Importer chaque CSV ajouté
        run: |
          for f in data/certifications/*.csv; do
            [ -e "$f" ] || continue
            case "$(basename "$f")" in
              upfi-*) source=UPFI ;;
              *) source=SNEP ;;
            esac
            echo "→ Import de $f (source: $source)"
            node pipelines/import-certifications.js "$f" --source="$source"
          done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
