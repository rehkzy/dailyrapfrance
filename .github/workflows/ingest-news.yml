name: Ingestion Actus (RSS, toutes les 30 min)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Lancer l'ingestion des actus
        run: node pipelines/ingest-news.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
