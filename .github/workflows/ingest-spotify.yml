name: Ingestion Spotify (horaire, top artistes)

on:
  schedule:
    - cron: "0 * * * *"   # toutes les heures — remplace Trigger.dev, gratuit sur GitHub Actions
  workflow_dispatch: {}     # permet de le lancer manuellement depuis l'onglet Actions

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm ci --prefix pipelines

      - name: Lancer l'ingestion Spotify
        run: node pipelines/ingest-spotify.js
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # URL Supabase Postgres
