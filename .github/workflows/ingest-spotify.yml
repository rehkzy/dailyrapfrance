name: Ingestion Deezer (horaire, top artistes)

on:
  schedule:
    - cron: "0 * * * *"   # toutes les heures — remplace Trigger.dev, gratuit sur GitHub Actions
  workflow_dispatch: {}     # permet de le lancer manuellement depuis l'onglet Actions

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Lancer l'ingestion Deezer
        run: node pipelines/ingest-spotify.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # URL Supabase Postgres (pooler)
