name: Ingestion Chart Deezer (hebdomadaire, Rap/Hip-Hop)

on:
  schedule:
    - cron: "0 6 * * 1"   # tous les lundis 6h UTC
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Lancer l'ingestion du chart Deezer
        run: node pipelines/ingest-chart.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
